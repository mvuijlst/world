# /etc/nginx/sites-available/world-yusupov  (certbot adds the TLS lines and the :80 redirect)
server {
    listen 80;
    listen [::]:80;
    server_name world.yusupov.cloud;

    root /home/django/world-yusupov;
    index index.html;

    access_log /var/log/nginx/world.yusupov.cloud.access.log;
    error_log  /var/log/nginx/world.yusupov.cloud.error.log warn;

    # Only the app is public: not hidden files, the server source or the docs
    location ~ /\. { deny all; }
    location ^~ /server/ { return 404; }
    location = /README.md { return 404; }

    # Django: the API and its admin
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8031;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
        add_header Cache-Control "no-store";
    }
    location ^~ /django-static/ {
        alias /home/django/world-yusupov/server/staticfiles/;
        expires 30d;
    }

    # The app: always revalidate, so a deploy reaches the browser on the next load
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
